name: CI

on:
  push:
    branches: [main, master]
  pull_request:

defaults:
  run:
    working-directory: st_control

jobs:
  backend:
    name: Rust (tests + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: st_control/src-tauri

      - name: Run Rust unit tests (no onnx-ocr 最小依赖面；comctl32 v6 清单由 build.rs 注入，测试二进制可正常启动)
        working-directory: st_control/src-tauri
        run: cargo test --lib --no-default-features

      - name: Build app (default features 含 onnx-ocr)
        working-directory: st_control/src-tauri
        run: cargo build

  frontend:
    name: Frontend (typecheck + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: st_control/package-lock.json

      - name: Install dependencies
        working-directory: st_control
        run: npm ci

      - name: Svelte typecheck
        working-directory: st_control
        run: npx svelte-check --output human

      - name: Production build
        working-directory: st_control
        run: npm run build
