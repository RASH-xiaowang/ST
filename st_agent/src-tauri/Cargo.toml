[package]
name = "st-agent"
version = "1.0.0"
description = "ST Agent - Auto-connects to ST Control"
authors = ["ST Team"]
edition = "2021"

[lib]
name = "st_agent_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
log = "0.4"
env_logger = "0.11"
